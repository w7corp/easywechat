name: Test
on: [push, pull_request]

jobs:
  phpunit:
    name: PHP-${{ matrix.php_version }}-${{ matrix.prefer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - 8.0
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        prefer:
          - stable
          - lowest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          coverage: none
      # PHP 8.0 上 symfony/cache 会被解析到 5.4，而它与 psr/simple-cache 3.0+
      # 运行时不兼容（symfony/cache 6.0 起才支持）。PHP 8.0 已 EOL，此处仅作约束
      # 使 CI 可用，计划在下个 minor 版本中移除对 PHP 8.0 的支持。
      - name: Constrain psr/simple-cache on PHP 8.0
        if: matrix.php_version == 8.0
        run: composer require --no-interaction --no-update "psr/simple-cache:^1.0|^2.0"
      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction --prefer-${{ matrix.prefer }}
      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

  phpunit-symfony-8:
    name: PHP-8.4-symfony-8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Require Symfony 8
        run: |
          composer require --no-interaction --no-update \
            "symfony/cache:^8.0" \
            "symfony/http-foundation:^8.0" \
            "symfony/psr-http-message-bridge:^8.0" \
            "symfony/http-client:^8.0" \
            "symfony/mime:^8.0" \
            "symfony/var-dumper:^8.0"
      - name: Install Dependencies
        run: composer update -W --prefer-dist --no-interaction
      - name: Run PHPUnit
        run: ./vendor/bin/phpunit
